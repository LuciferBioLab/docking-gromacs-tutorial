name: Publish the public reference release

on:
  push:
    branches: [main]
    paths:
      - CITATION.cff
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-reference-release
  cancel-in-progress: false

jobs:
  reference:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - id: release
        name: Check the citation version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(awk '$1 == "version:" { print $2; exit }' CITATION.cff | tr -d '"')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            printf 'exists=true\n' >> "$GITHUB_OUTPUT"
          fi
      - uses: mamba-org/setup-micromamba@v2
        if: steps.release.outputs.exists != 'true'
        with:
          environment-file: environment.yml
          cache-environment: true
      - name: Verify source and run the public CPU fixture
        if: steps.release.outputs.exists != 'true'
        shell: micromamba-shell {0}
        run: |
          make check-docs fixtures
          make smoke RUN=runs/release-1iep THREADS=2
          python scripts/package_smoke.py runs/release-1iep 1iep-cpu-smoke.zip
          unzip -t 1iep-cpu-smoke.zip
          sha256sum 1iep-cpu-smoke.zip > 1iep-cpu-smoke.zip.sha256
      - name: Publish the verified example
        if: steps.release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          existing=$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}" | tail -n1 | cut -f1)
          if [[ -n "$existing" && "$existing" != "$GITHUB_SHA" ]]; then
            echo "A tag already exists at a different commit." >&2
            exit 1
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes 1iep-cpu-smoke.zip 1iep-cpu-smoke.zip.sha256

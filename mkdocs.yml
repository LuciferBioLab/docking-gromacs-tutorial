site_name: Docking and GROMACS
repo_url: https://github.com/LuciferBioLab/docking-gromacs-tutorial
theme:
  name: material
  language: en
markdown_extensions:
  - md_in_html
plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
        - locale: zh
          name: 简体中文
          nav_translations:
            Home: 首页
            Quickstart: 快速入门
            Workflow: 流程与文件地图
            Environment: 环境与重对接
            Docking: 对接与位姿交接
            System setup: 力场与建系
            Simulation: 平衡与生产
            Analysis: 轨迹分析与出图
            Validation: 对接验证
            Research extensions: 研究扩展
            Troubleshooting: 排错
            FAQ: 常见问题
            Glossary: 术语
            References: 参考文献
exclude_docs: |
  source/
nav:
  - Home: index.md
  - Quickstart: QUICKSTART.md
  - Workflow: WORKFLOW.md
  - Environment: ENVIRONMENT.md
  - Docking: DOCKING.md
  - System setup: SYSTEM_SETUP.md
  - Simulation: SIMULATION.md
  - Analysis: ANALYSIS.md
  - Validation: DOCKING_VALIDATION.md
  - Research extensions: RESEARCH.md
  - Troubleshooting: TROUBLESHOOTING.md
  - FAQ: FAQ.md
  - Glossary: GLOSSARY.md
  - References: REFERENCES.md
